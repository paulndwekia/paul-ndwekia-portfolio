<title id="t">FINTEL — Kenya Financial Intelligence product interface preview</title>
<desc id="d">A product-interface preview based on the current FINTEL React homepage and design system, with its forest-green, jade and brass palette, Kenyan market navigation, source-aware data presentation and financial workspaces. No market figures are fabricated.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c211d"/><stop offset="1" stop-color="#071713"/></linearGradient><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#193d32"/><stop offset="1" stop-color="#102820"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b3cfba" stroke-opacity=".055"/></pattern><filter id="sh" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter></defs>
