<text x="23" y="108" fill="#789187" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">MARKETS</text><rect x="12" y="121" width="232" height="40" rx="8" fill="#1b3c31" stroke="#d4ad59" stroke-opacity=".28"/><path d="M27 145l5-7 4 4 6-8" fill="none" stroke="#d4ad59" stroke-width="1.6"/><text x="56" y="147" fill="#efd69a" font-family="Arial,sans-serif" font-size="12" font-weight="700">Overview</text>
<g fill="#b5c6ba" font-family="Arial,sans-serif" font-size="11"><text x="26" y="190">Markets</text><text x="26" y="224">Yield curve</text><text x="26" y="258">Treasury Bills &amp; Bonds</text><text x="26" y="292">Derivatives lab</text><text x="26" y="326">Risk</text><text x="26" y="360">Portfolio</text><text x="26" y="394">Quant models</text></g><text x="23" y="435" fill="#789187" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">RESEARCH &amp; LEARNING</text><g fill="#b5c6ba" font-family="Arial,sans-serif" font-size="11"><text x="26" y="463">Research desk</text><text x="26" y="497">Academy</text><text x="26" y="531">Data sources</text><text x="26" y="565">Settings</text></g><path d="M18 628H238" stroke="#c4d9ca" stroke-opacity=".12"/><circle cx="29" cy="654" r="4" fill="#8fb9a2"/><text x="43" y="658" fill="#90a99a" font-family="Arial,sans-serif" font-size="9">Workspace connected</text>
