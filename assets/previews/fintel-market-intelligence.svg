<text x="320" y="181" fill="#9fbea9" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">KENYAN MARKETS, BROUGHT CLOSER</text><text x="320" y="229" fill="#f2ecdf" font-family="Georgia,serif" font-size="35">Make sense of the market.</text><text x="320" y="271" fill="#d4ad59" font-family="Georgia,serif" font-size="35" font-style="italic">One decision at a time.</text><text x="320" y="304" fill="#bfcdc1" font-family="Arial,sans-serif" font-size="12">From the shilling and Treasury auctions to yield curves and portfolio risk,</text><text x="320" y="324" fill="#bfcdc1" font-family="Arial,sans-serif" font-size="12">FINTEL brings the information together — and shows you where it came from.</text>
