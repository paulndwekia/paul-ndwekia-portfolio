name: Portfolio data sync

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'assets/previews/**'
      - 'assets/profile/**'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: portfolio-data-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'issues' || (github.event.issue.user.login == 'paulndwekia' && (startsWith(github.event.issue.title, 'LinkedIn publication:') || startsWith(github.event.issue.title, 'Withdraw LinkedIn evidence:') || startsWith(github.event.issue.title, 'Profile photo update:')))
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate portfolio scripts and data
        run: |
          node --check app.js
          node --check scripts/sync.mjs
          node --check scripts/capture-previews.mjs
          node --check scripts/register-linkedin-publication.mjs
          node --check scripts/register-profile-photo.mjs
          node -e "for (const file of ['data/projects.json','data/linkedin-evidence.json','data/github-progress.json','data/profile.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'))"

      - name: Register LinkedIn publication evidence
        if: github.event_name == 'issues' && (startsWith(github.event.issue.title, 'LinkedIn publication:') || startsWith(github.event.issue.title, 'Withdraw LinkedIn evidence:'))
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/register-linkedin-publication.mjs

      - name: Update portfolio profile photo
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'Profile photo update:')
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/register-profile-photo.mjs
      - name: Refresh public GitHub projects and progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: paulndwekia
        run: node scripts/sync.mjs

      - name: Install Playwright browser for project screenshots
        if: github.event_name != 'issues'
        run: |
          npm install --prefix /tmp/portfolio-browser playwright
          /tmp/portfolio-browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Capture real public project websites
        if: github.event_name != 'issues'
        env:
          PLAYWRIGHT_MODULE: /tmp/portfolio-browser/node_modules/playwright/index.mjs
        run: node scripts/capture-previews.mjs

      - name: Commit updated portfolio data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/github-progress.json data/linkedin-evidence.json data/profile.json assets/previews/ assets/profile/
          if git diff --cached --quiet; then
            echo "No portfolio data changes."
          else
            git commit -m "chore: refresh portfolio progress and publication evidence"
            git push
          fi

      - name: Confirm LinkedIn evidence change
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const withdrawn = context.payload.issue.title.startsWith("Withdraw LinkedIn evidence:");
            const profileUpdate = context.payload.issue.title.startsWith("Profile photo update:");
            const message = profileUpdate
              ? "The portfolio profile photo setting was updated. The change will be visible to all visitors after the production deployment. The GitHub avatar remains the fallback."
              : withdrawn
                ? "The LinkedIn publication evidence has been withdrawn. This project no longer qualifies as Completed on the portfolio."
                : "The LinkedIn publication evidence was registered. This project now qualifies as Completed on the portfolio. If you supplied an original public image URL, it will appear on the project card after deployment.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });