name: Portfolio validation

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "research/**"
      - "src/**"
      - "styles.css"
      - "app.js"
      - "data/**"
      - "assets/**"
      - "package.json"
      - "vite.config.js"
      - "scripts/**"
      - ".github/workflows/portfolio-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate data and build React application
        run: |
          node -e "for (const file of ['data/projects.json','data/linkedin-evidence.json','data/github-progress.json','data/profile.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'))"
          npm install --no-audit --no-fund
          npm run build

      - name: Install Playwright
        run: |
          npm install --prefix /tmp/portfolio-browser playwright
          /tmp/portfolio-browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Test desktop and narrow Android-sized layouts
        env:
          PLAYWRIGHT_MODULE: /tmp/portfolio-browser/node_modules/playwright/index.mjs
        run: node scripts/test-project-filters.mjs
